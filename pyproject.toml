[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "documentops-review-gateway"
version = "0.1.0"
description = "Evidence-first review gateway for synthetic Korean business documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyyaml>=6.0",
]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.domain",
  "app.services",
  "app.services.extraction",
  "app.templates",
  "app.static",
]
include-package-data = true

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: relatively slow end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI의 File(...)/Query(...)는 프레임워크 표준 패턴이다.
"app/api/*.py" = ["B008"]
