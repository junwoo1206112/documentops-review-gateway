commands:
  setup:
    - "python -m venv .venv"
    - ".venv\\Scripts\\activate  # Windows"
    - "pip install -e \".[dev]\""
  verify:
    - "python -m pytest -q"
    - "python tools/generate_dataset.py --check"
    - "python -m app.evaluate --dataset fixtures/evaluation --report artifacts/evaluation_report.json"
    - "python -m app.evaluate --dataset fixtures/evaluation_layout2 --report artifacts/evaluation_report_evaluation_layout2.json"
  run:
    - "uvicorn app.asgi:app --reload"
    - "python scripts/seed_demo.py"
  docker:
    - "docker compose up -d --build"
    - "docker compose exec -T gateway python -m app.evaluate --dataset fixtures/evaluation"
    - "docker compose down"

key_paths:
  contract_docs: [docs/schema.md, docs/rules.md, docs/evaluation.md]
  single_sources:
    statuses: app/domain/statuses.py
    fields: app/domain/fields.py
    rules: app/domain/rules.py
    versions: app/version.py
  pipeline: app/services/pipeline.py
  review_service: app/services/review.py
  api: app/api/routes.py
  ui: app/templates/
  evaluator: app/evaluate.py
  dataset_generator: tools/generate_dataset.py
  reviews: docs/reviews/
  decisions: docs/decisions/pending.md

