schema: handoff-seed-1
as_of: "2026-11-27"
project: documentops-review-gateway
status: phase-17j-handoff-consistency
language: ko

goal: >
  합성 한국어 업무 문서를 원문 근거와 규칙 검증, 사람 승인, append-only 감사,
  고정 데이터셋 평가로 안전하게 처리하는 검토 게이트를 포트폴리오 수준으로 유지·확장한다.

constraints:
  - 실제 개인정보와 실제 고객 문서를 사용하지 않는다.
  - 승인과 반려는 사람만 수행하며 자동 승인 경로를 만들지 않는다.
  - 기본 실행 경로는 외부 LLM API 키와 네트워크 없이 재현되어야 한다.
  - OCR은 현재 릴리스에서 채택하지 않으며, 실제 스캔 요구와 새 Gate 결정 전까지 텍스트 전용을 유지한다.
  - fixtures/evaluation은 생성기로만 수정하고 테스트 중에는 읽기 전용이다.

invariants:
  - id: no-auto-approval
    rule: APPROVED 상태는 사람 별칭과 사유가 있는 decision 요청으로만 도달한다.
    source: app/domain/statuses.py
  - id: no-hold-to-approved
    rule: HOLD에서 APPROVED로 가는 직접 전이는 금지된다.
    source: app/domain/statuses.py
  - id: blocking-means-hold
    rule: severity=blocking 이슈가 1건 이상이면 HOLD다.
    source: app/services/validation.py
  - id: evidence-required
    rule: verified 근거가 없는 값은 MISSING_EVIDENCE로 HOLD된다.
    source: app/services/evidence.py
  - id: append-only-audit
    rule: audit_events는 UPDATE와 DELETE가 DB 트리거로 차단된다.
    source: app/db.py

versions:
  app: "0.1.0"
  extractor: deterministic-1.1.0
  ruleset: rules-1.0.0
  dataset: synth-2026-11-26.3
  vendor_registry: vendors-2026-11-26.1

