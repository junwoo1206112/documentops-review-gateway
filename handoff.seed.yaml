  platform: "Windows 11, Python 3.12.10"
  tests_passed: 157
  tests_collected_after_phase_6: 133
  dataset_check: pass
  evaluation_exit_code: 0
  metrics:
    document_exact_match: {matched: 36, total: 36, value: 1.0}
    hold_recall: {matched: 19, total: 19, value: 1.0}
    false_hold_rate: {matched: 0, total: 17, value: 0.0}
    rule_match: {matched: 36, total: 36, value: 1.0}
