<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}DocumentOps Review Gateway{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <strong>DocumentOps</strong>
        <span>Review Gateway</span>
      </a>
      <nav class="nav">
        <a href="/">문서</a>
        <a href="/evaluation">평가</a>
        <a href="/api/meta">API 카탈로그</a>
      </nav>
      <span class="notice">합성 데이터 · 자동 승인 없음</span>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <p>
        모든 문서·거래처·번호는 생성기가 만든 합성값입니다. 승인·반려는 사람만 수행하며,
        모든 상태 변경은 append-only 감사 이력에 기록됩니다.
      </p>
    </footer>
  </body>
</html>
