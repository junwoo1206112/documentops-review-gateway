services:
  gateway:
    build: .
    image: documentops-review-gateway:local
    ports:
      - "8000:8000"
    environment:
      DOCUMENTS_DB_PATH: /app/data/documentops.db
      RATE_LIMIT_PER_MINUTE: "120"
      TRUST_PROXY_HEADERS: "false"
    volumes:
      - documentops-data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  documentops-data:
